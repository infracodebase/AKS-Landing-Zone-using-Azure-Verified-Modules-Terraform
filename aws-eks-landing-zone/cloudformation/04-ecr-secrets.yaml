AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS EKS Landing Zone - ECR Registry and Secrets Management'

Parameters:
  EnvironmentName:
    Description: Environment name (dev, staging, prod)
    Type: String
    Default: dev

  ClusterName:
    Description: EKS Cluster name
    Type: String
    Default: eks-cluster

  VPCStackName:
    Description: Name of the VPC CloudFormation stack
    Type: String

  EnableImageScanning:
    Description: Enable image vulnerability scanning
    Type: String
    Default: true
    AllowedValues: [true, false]

  ImageTagMutability:
    Description: Image tag mutability setting
    Type: String
    Default: MUTABLE
    AllowedValues: [MUTABLE, IMMUTABLE]

  LifecyclePolicyDays:
    Description: Number of days to retain untagged images
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365

Resources:
  # KMS Key for ECR encryption
  ECRKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS key for ECR encryption - ${ClusterName}-${EnvironmentName}'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow ECR Service
            Effect: Allow
            Principal:
              Service: ecr.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      EnableKeyRotation: true
      Tags:
        - Key: Name
          Value: !Sub 'kms-ecr-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # KMS Key Alias
  ECRKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/ecr-${ClusterName}-${EnvironmentName}'
      TargetKeyId: !Ref ECRKMSKey

  # ECR Repository for application containers
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ClusterName}-${EnvironmentName}'
      ImageTagMutability: !Ref ImageTagMutability
      ImageScanningConfiguration:
        ScanOnPush: !Ref EnableImageScanning
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref ECRKMSKey
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Delete untagged images older than ${LifecyclePolicyDays} days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${LifecyclePolicyDays}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEKSNodesAccess
            Effect: Allow
            Principal:
              AWS: '*'
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
            Resource: '*'
            Condition:
              StringEquals:
                'aws:PrincipalTag/eksCluster': !Sub '${ClusterName}-${EnvironmentName}'
      Tags:
        - Key: Name
          Value: !Sub 'ecr-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Additional ECR repository for base images
  ECRRepositoryBase:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ClusterName}-${EnvironmentName}-base'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref ECRKMSKey
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 tagged base images",
                "selection": {
                  "tagStatus": "tagged",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Delete untagged base images older than 3 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 3
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub 'ecr-${ClusterName}-${EnvironmentName}-base'
        - Key: Environment
          Value: !Ref EnvironmentName

  # KMS Key for Secrets Manager
  SecretsManagerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS key for Secrets Manager - ${ClusterName}-${EnvironmentName}'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager Service
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      EnableKeyRotation: true
      Tags:
        - Key: Name
          Value: !Sub 'kms-secrets-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # KMS Key Alias for Secrets Manager
  SecretsManagerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/secrets-${ClusterName}-${EnvironmentName}'
      TargetKeyId: !Ref SecretsManagerKMSKey

  # Example secret for database credentials
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ClusterName}-${EnvironmentName}/database/credentials'
      Description: 'Database credentials for EKS applications'
      KmsKeyId: !Ref SecretsManagerKMSKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Name
          Value: !Sub 'secret-db-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Example secret for API keys
  APIKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ClusterName}-${EnvironmentName}/api/keys'
      Description: 'API keys for external service integrations'
      KmsKeyId: !Ref SecretsManagerKMSKey
      SecretString: !Sub |
        {
          "external_service_api_key": "change-me-after-deployment",
          "webhook_secret": "change-me-after-deployment",
          "jwt_secret": "change-me-after-deployment"
        }
      Tags:
        - Key: Name
          Value: !Sub 'secret-api-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # SSM Parameter for cluster configuration
  ClusterConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ClusterName}-${EnvironmentName}/cluster/config'
      Type: String
      Value: !Sub |
        {
          "cluster_name": "${ClusterName}-${EnvironmentName}",
          "environment": "${EnvironmentName}",
          "region": "${AWS::Region}",
          "ecr_repository": "${ECRRepository}",
          "ecr_base_repository": "${ECRRepositoryBase}",
          "log_retention_days": 30,
          "monitoring_enabled": true
        }
      Description: 'Cluster configuration parameters'
      Tags:
        Environment: !Ref EnvironmentName
        Cluster: !Sub '${ClusterName}-${EnvironmentName}'

  # SSM Parameter for image pull settings
  ImagePullParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ClusterName}-${EnvironmentName}/container/image-pull'
      Type: String
      Value: !Sub |
        {
          "ecr_endpoint": "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com",
          "image_pull_policy": "IfNotPresent",
          "scan_on_push": ${EnableImageScanning},
          "lifecycle_policy_days": ${LifecyclePolicyDays}
        }
      Description: 'Container image pull configuration'
      Tags:
        Environment: !Ref EnvironmentName
        Cluster: !Sub '${ClusterName}-${EnvironmentName}'

  # CloudWatch Log Group for container logs
  ContainerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/eks/${ClusterName}-${EnvironmentName}/containers'
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub 'lg-containers-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # CloudWatch Log Group for application logs
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/eks/${ClusterName}-${EnvironmentName}/applications'
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub 'lg-applications-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # CloudWatch Log Group for cluster logs
  ClusterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/eks/${ClusterName}-${EnvironmentName}/cluster'
      RetentionInDays: 90
      Tags:
        - Key: Name
          Value: !Sub 'lg-cluster-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # S3 Bucket for cluster artifacts and backups
  ClusterArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ClusterName}-${EnvironmentName}-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub 's3-artifacts-${ClusterName}-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName

  # S3 Bucket Policy
  ClusterArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ClusterArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ClusterArtifactsBucket.Arn
              - !Sub '${ClusterArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: AllowEKSServiceAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt ClusterArtifactsBucket.Arn
              - !Sub '${ClusterArtifactsBucket.Arn}/*'

Outputs:
  ECRRepositoryURI:
    Description: ECR Repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}'
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepositoryURI'

  ECRRepositoryName:
    Description: ECR Repository Name
    Value: !Ref ECRRepository
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepositoryName'

  ECRBaseRepositoryURI:
    Description: ECR Base Repository URI
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepositoryBase}'
    Export:
      Name: !Sub '${AWS::StackName}-ECRBaseRepositoryURI'

  ECRBaseRepositoryName:
    Description: ECR Base Repository Name
    Value: !Ref ECRRepositoryBase
    Export:
      Name: !Sub '${AWS::StackName}-ECRBaseRepositoryName'

  DatabaseSecretArn:
    Description: Database Secret ARN
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'

  APIKeySecretArn:
    Description: API Key Secret ARN
    Value: !Ref APIKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-APIKeySecretArn'

  ContainerLogGroupName:
    Description: Container Log Group Name
    Value: !Ref ContainerLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-ContainerLogGroupName'

  ClusterLogGroupName:
    Description: Cluster Log Group Name
    Value: !Ref ClusterLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-ClusterLogGroupName'

  ClusterArtifactsBucketName:
    Description: Cluster Artifacts S3 Bucket Name
    Value: !Ref ClusterArtifactsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ClusterArtifactsBucketName'

  ECRKMSKeyId:
    Description: ECR KMS Key ID
    Value: !Ref ECRKMSKey
    Export:
      Name: !Sub '${AWS::StackName}-ECRKMSKeyId'

  SecretsManagerKMSKeyId:
    Description: Secrets Manager KMS Key ID
    Value: !Ref SecretsManagerKMSKey
    Export:
      Name: !Sub '${AWS::StackName}-SecretsManagerKMSKeyId'